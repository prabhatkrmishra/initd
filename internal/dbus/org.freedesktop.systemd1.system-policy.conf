<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/dbus-bus-config.dtd">
<busconfig>
  <!--
    D-Bus system bus policy for org.freedesktop.systemd1 provided by initd.

    On hosts where systemd is NOT the init system (initd-backed), real
    /usr/bin/systemctl (system scope) connects to the system bus and looks
    for an owner of org.freedesktop.systemd1. Without systemd there is no
    owner, so tools get "Failed to connect to bus: Permission denied" and
    fail closed.
    This policy lets the initd daemon (which may run as a non-root user,
    see deploy-systemd1.sh RUN_USER) own the org.freedesktop.systemd1 name
    so it can answer systemctl probes.

    Authorization model (read the send rules carefully):
    - context="default" (every local user) may call ONLY the read-only
      Manager members listed below (GetUnit, LoadUnit, ListUnits*, ...),
      plus standard Properties/Introspectable reads. In particular NOBODY
      except root may call StartUnit, StopUnit, RestartUnit, Reload*,
      TryRestart*, KillUnit, ResetFailedUnit, Enable/DisableUnitFiles,
      Reload (daemon-reload), or any method on the per-unit
      Unit/Service interfaces (all mutating). D-Bus policy has no
      "all except" wildcard, so mutating members are secured by simply
      not listing them here.
    - user="root" may call everything (full management).
    NOTE: <allow send_destination> without send_member would permit ALL
    members -- never use the bare form for the Manager interface.
    NOTE: any local user may still own the name (first-come squat risk
    inherent to a non-root daemon owning a system-bus name); clients that
    need integrity guarantees should prefer the IPC socket.
  -->
  <policy context="default">
    <allow own="org.freedesktop.systemd1"/>
    <allow send_destination="org.freedesktop.systemd1" send_interface="org.freedesktop.systemd1.Manager" send_member="GetUnit"/>
    <allow send_destination="org.freedesktop.systemd1" send_interface="org.freedesktop.systemd1.Manager" send_member="LoadUnit"/>
    <allow send_destination="org.freedesktop.systemd1" send_interface="org.freedesktop.systemd1.Manager" send_member="GetUnitByPID"/>
    <allow send_destination="org.freedesktop.systemd1" send_interface="org.freedesktop.systemd1.Manager" send_member="GetUnitByControlGroup"/>
    <allow send_destination="org.freedesktop.systemd1" send_interface="org.freedesktop.systemd1.Manager" send_member="GetUnitFileState"/>
    <allow send_destination="org.freedesktop.systemd1" send_interface="org.freedesktop.systemd1.Manager" send_member="ListUnits"/>
    <allow send_destination="org.freedesktop.systemd1" send_interface="org.freedesktop.systemd1.Manager" send_member="ListUnitsFiltered"/>
    <allow send_destination="org.freedesktop.systemd1" send_interface="org.freedesktop.systemd1.Manager" send_member="ListUnitsByNames"/>
    <allow send_destination="org.freedesktop.systemd1" send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="org.freedesktop.systemd1" send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>
  <policy user="root">
    <allow own="org.freedesktop.systemd1"/>
    <allow send_destination="org.freedesktop.systemd1"/>
  </policy>
</busconfig>
